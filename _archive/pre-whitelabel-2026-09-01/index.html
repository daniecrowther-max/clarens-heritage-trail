<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Clarens Heritage Trail — Temporarily Offline</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --olive:#4a5240;--sage:#c8d4b8;--gold:#c8a052;--plaque-blue:#1a4a7a;
  --sage-pale:#f2f5ee;--text-mid:#3d4a30;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(160deg,var(--sage-pale) 0%,var(--sage) 100%);
  color:var(--olive);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
}
.card{max-width:440px;width:100%}
.emblem{margin:0 auto 24px;display:block;width:140px;height:auto;max-width:100%}
h1{
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:clamp(1.8rem,6vw,2.4rem);
  color:var(--olive);
  margin-bottom:10px;
  line-height:1.15;
}
.subhead{
  font-family:'Playfair Display',serif;
  font-weight:600;
  font-size:1.05rem;
  color:var(--plaque-blue);
  margin-bottom:18px;
  line-height:1.4;
}
.msg{
  font-size:.95rem;
  line-height:1.7;
  color:var(--text-mid);
  margin-bottom:28px;
}
.msg a{color:var(--plaque-blue);font-weight:600;text-decoration:none}
.msg a:hover{text-decoration:underline}
footer{
  font-size:.72rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--olive);
  font-weight:600;
}
</style>
</head>
