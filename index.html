<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Clarens Heritage Trail — Temporarily Offline</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --olive:#4a5240;--sage:#c8d4b8;--gold:#c8a052;--plaque-blue:#1a4a7a;
  --sage-pale:#f2f5ee;--text-mid:#3d4a30;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(160deg,var(--sage-pale) 0%,var(--sage) 100%);
  color:var(--olive);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
}
.card{max-width:440px;width:100%}
.emblem{margin:0 auto 24px;display:block}
h1{
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:clamp(1.8rem,6vw,2.4rem);
  color:var(--olive);
  margin-bottom:10px;
  line-height:1.15;
}
.subhead{
  font-family:'Playfair Display',serif;
  font-weight:600;
  font-size:1.05rem;
  color:var(--plaque-blue);
  margin-bottom:18px;
  line-height:1.4;
}
.msg{
  font-size:.95rem;
  line-height:1.7;
  color:var(--text-mid);
  margin-bottom:28px;
}
.msg a{color:var(--plaque-blue);font-weight:600;text-decoration:none}
.msg a:hover{text-decoration:underline}
footer{
  font-size:.72rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--olive);
  font-weight:600;
}
</style>
</head>
<body>
<!-- Onderhoud-bladsy: vervang tydelik die volle PWA. Geen JS, SW-registrasie of manifest-koppeling nie — 'n dooie, statiese bladsy. -->
<div class="card">
  <svg class="emblem" width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clarens Heritage Association emblem">
    <circle cx="36" cy="36" r="32" fill="none" stroke="#c8a052" stroke-width="2.5"/>
    <circle cx="36" cy="36" r="24" fill="none" stroke="#c8a052" stroke-width="1"/>
    <text x="36" y="43" font-family="Playfair Display, serif" font-size="24" font-weight="700" fill="#c8a052" text-anchor="middle">CHA</text>
  </svg>
  <h1>We'll Be Right Back</h1>
  <p class="subhead">The Clarens Heritage Trail app is temporarily offline for maintenance.</p>
  <p class="msg">We're working on updates to bring you an even better experience. Please check back soon. For enquiries, visit <a href="https://clarensheritage.org">clarensheritage.org</a> or email <a href="mailto:info@clarensheritage.org">info@clarensheritage.org</a>.</p>
  <footer>Clarens Heritage Association</footer>
</div>
</body></html>
